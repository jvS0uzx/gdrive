resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;

  set $engine http://engine:8080;
  set $api http://api:8000;

  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/json application/geo+json application/javascript text/css application/vnd.mapbox-vector-tile;

  location ~ ^/(city|city\.geojson|route|route/alternatives|healthz)$ {
    proxy_pass $engine;
  }

  location /api/ {
    proxy_pass $api;
  }

  location /journey/ {
    proxy_pass $engine;
  }

  location /tiles/ {
    proxy_pass $engine;
  }

  location /ws/ {
    proxy_pass $engine;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location ~ \.mjs$ {
    root /usr/share/nginx/html;
    types { }
    default_type application/javascript;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
