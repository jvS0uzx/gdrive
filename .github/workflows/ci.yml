name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache: false

      - name: gofmt
        run: |
          arquivos=$(gofmt -l .)
          if [ -n "$arquivos" ]; then
            echo "gofmt pendente em:"; echo "$arquivos"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: engine

      - name: go test
        run: go test -count=1 -race ./...

  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_PASSWORD: gdrive
          POSTGRES_DB: gdrive_test
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d gdrive_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 30
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:gdrive@localhost:5432/gdrive_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"

      - run: uv sync --frozen

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: tipos e build
        run: pnpm build

  e2e:
    runs-on: ubuntu-24.04
    needs: [engine, api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: sobe a pilha com o simulador acelerado
        env:
          SIM_SPEED: "30"
          SIM_ORDER_EVERY: 2s
        run: docker compose up --build --wait

      - name: pedidos entregues de ponta a ponta
        run: |
          for i in $(seq 1 120); do
            entregues=$(curl -s localhost:8085/api/stats | python3 -c 'import json,sys; print(json.load(sys.stdin)["delivered"])' || echo 0)
            echo "entregues: $entregues"
            if [ "$entregues" -ge 3 ]; then exit 0; fi
            sleep 5
          done
          curl -s localhost:8085/api/stats
          exit 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: e2e no Chromium
        working-directory: web
        env:
          BASE_URL: http://localhost:8085
        run: pnpm e2e

      - name: logs da pilha
        if: failure()
        run: docker compose logs
