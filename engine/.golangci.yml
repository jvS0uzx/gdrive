version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - (*github.com/coder/websocket.Conn).CloseNow
        - (*github.com/redis/go-redis/v9.PubSub).Close
        - (*github.com/redis/go-redis/v9.Client).Close
